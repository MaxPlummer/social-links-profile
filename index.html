<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <article class="profile-card">
      <img
        src="./assets/images/avatar-max.jpg"
        alt="Max Plummer"
        class="avatar"
      />
      <header class="description">
        <h1 class="name">Max Plummer</h1>
        <p class="locale">Florida, United States</p>
      </header>
      <span class="tagline">"Front-end developer and avid gamer."</span>
      <nav class="social-links">
        <a
          class="social-link"
          href="https://github.com/MaxPlummer"
          target="_blank"
          >GitHub</a
        >
        <a
          class="social-link"
          href="https://www.frontendmentor.io/profile/MaxPlummer"
          target="_blank"
          >Frontend Mentor</a
        >
        <a
          class="social-link"
          href="https://www.linkedin.com/in/maxwell-plummer-1b2b13291/"
          target="_blank"
          >LinkedIn</a
        >
      </nav>
    </article>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://github.com/MaxPlummer" target="_blank">Max Plummer</a>.
    </footer>
  </body>
</html>
